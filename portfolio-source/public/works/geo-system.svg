  <text x="600" y="950" text-anchor="middle" fill="#eef0f8" fill-opacity="0.6" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="44" letter-spacing="4">内容增长系统</text>
