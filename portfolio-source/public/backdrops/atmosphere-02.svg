<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" role="img" aria-label="电影感氛围底图">
  <defs>
    <linearGradient id="base-b" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="100%" stop-color="#080611" />
    </linearGradient>
    <radialGradient id="vig-b" cx="0.5" cy="0.46" r="0.78">
      <stop offset="52%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.82" />
    </radialGradient>
    
    <filter id="soft-b-0" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="150" />
    </filter>
    <filter id="soft-b-1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="150" />
    </filter>
    <filter id="soft-b-2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="150" />
    </filter>
    
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#base-b)" />

  <ellipse cx="640" cy="380" rx="700" ry="300" fill="#36d6c8"
      opacity="0.3" filter="url(#soft-b-0)" transform="rotate(-8 640 380)" />
  <ellipse cx="1500" cy="820" rx="720" ry="340" fill="#5b4bff"
      opacity="0.34" filter="url(#soft-b-1)" transform="rotate(10 1500 820)" />
  <ellipse cx="1060" cy="240" rx="480" ry="220" fill="#123a52"
      opacity="0.6" filter="url(#soft-b-2)" transform="rotate(0 1060 240)" />

  <ellipse cx="520" cy="720" rx="620" ry="30"
    fill="#c8f7ff" opacity="0.1" transform="rotate(6 520 720)"
    filter="url(#soft-b-0)" />

  <rect width="1920" height="1200" fill="url(#vig-b)" />
  <rect width="1920" height="1200" filter="url(#grain)" opacity="0.13" style="mix-blend-mode:screen" />
</svg>
